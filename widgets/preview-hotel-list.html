<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin: 0; padding: 24px; background: #ececec; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Mock the host (ChatGPT injects this for real). Switch theme to "dark" to test dark mode.
      window.openai = {
        theme: "light",
        toolOutput: {
          query: { location: "Bandung" },
          hotels: [
            { hotel_id: "GSV", hotel_name: "Grand Alaric Hotel Bandung", star_rating: 5, area: "Bandung, West Java", image: "https://picsum.photos/seed/gsv/520/360" },
            { hotel_id: "TBGH", hotel_name: "Tubagus Hotel Bandung", star_rating: 4, area: "Bandung, West Java", image: "https://picsum.photos/seed/tbgh/520/360" },
            { hotel_id: "DEMO3", hotel_name: "Alaric Dago Suites", star_rating: 4, area: "Dago, Bandung", image: "https://picsum.photos/seed/dago/520/360" },
          ],
        },
        sendFollowUpMessage: (m) => alert("→ would send to ChatGPT:\n\n" + m.prompt),
        // Mock the instant in-widget navigation. Returns structuredContent like the real tools.
        callTool: async (name, args) => {
          await new Promise((r) => setTimeout(r, 400)); // simulate latency
          if (name === "get_hotel_details") {
            return {
              structuredContent: {
                hotel: {
                  hotel_id: args.hotel_id,
                  hotel_name: "Grand Alaric Hotel Bandung",
                  star_rating: 5,
                  address: "Jl. Tubagus Ismail Raya No. 49, Bandung, West Java",
                  description: "A family-friendly and romantic hotel in the culinary center of Dago, Bandung. Cool mountain breeze, intimate ambiance.",
                  gallery: [1, 2, 3, 4, 5].map((n) => `https://picsum.photos/seed/d${n}/600/400`),
                  amenities: [
                    { label: "Free Wifi in Room", icon: "wifi", available: true },
                    { label: "Indoor Swimming Pool", icon: "pool", available: true },
                    { label: "Air Conditioning", icon: "ac", available: true },
                    { label: "Car Parking", icon: "parking", available: true },
                    { label: "Restaurant", icon: "restaurant", available: true },
                    { label: "Fitness Center", icon: "gym", available: true },
                    { label: "Spa", icon: "spa", available: true },
                    { label: "Rooftop Bar", icon: "bar", available: true },
                    { label: "Concierge", icon: "check", available: true },
                    { label: "Shuttle Service", icon: "check", available: true },
                  ],
                  nearby: [
                    { label: "Gedung Merdeka", distance: "5.6 km" },
                    { label: "Kebun Binatang Bandung", distance: "2.1 km" },
                  ],
                  policies: { check_in: "14:00", check_out: "12:00" },
                },
              },
            };
          }
          if (name === "check_availability") {
            return {
              structuredContent: {
                query: { hotel_id: args.hotel_id, check_in: args.check_in_date, check_out: args.check_out_date, guests: args.guests },
                extras: [
                  { id: "dropoff", name: "Drop off to airport", price: 1500000, original_price: 1800000, image: "https://picsum.photos/seed/car1/520/300" },
                  { id: "pickup", name: "Pick up from Ngurah Rai airport", price: 1350000, original_price: 1500000, image: "https://picsum.photos/seed/car2/520/300" },
                  { id: "bf-child", name: "Breakfast for child", price: 80000, image: "https://picsum.photos/seed/bf1/520/300" },
                  { id: "bf-adult", name: "Breakfast for adult", price: 100000, original_price: 125000, image: "https://picsum.photos/seed/bf2/520/300", popular: true },
                ],
                rooms: [
                  { room_id: "SUPK-ROO", room_name: "Superior City View", room_name_sub: "Standard rate", price: 650000, room_image: "https://picsum.photos/seed/sup/520/360", meta: "1 queen bed · 2 guests · 28 m²", description: "A bright room with floor-to-ceiling city views and a plush queen bed.", facilities: ["Air Conditioning", "Balcony", "Bath Towel", "Cable TV", "Bottled Water", "Coffee Maker"] },
                  { room_id: "SUPK-IWS312ROO", room_name: "Superior City View", room_name_sub: "Book Direct & Save More", price: 520000, original_price: 650000, room_image: "https://picsum.photos/seed/sup/520/360" },
                  { room_id: "DLXK-ROO", room_name: "Deluxe King", room_name_sub: "Standard rate", price: 780000, room_image: "https://picsum.photos/seed/dlx/520/360", meta: "1 king or 2 singles · 3 guests · 35 m²", description: "A refined retreat with a plush king bed and a quiet sitting area.", facilities: ["Air Conditioning", "Balcony", "Body Lotion", "Cable TV", "Mini Bar", "Safe"] },
                  {
                    room_id: "JRST-EB4339BAR", room_name: "Junior Suite", room_name_sub: "Early Bird 14 Days",
                    price: 890000, original_price: 1100000, room_image: "https://picsum.photos/seed/jr/520/360",
                    conditions: [{ label: "Free cancellation until 48h before" }], benefits: [{ text: "Welcome drink" }, { text: "Late checkout" }],
                  },
                ],
              },
            };
          }
          if (name === "list_nationalities") {
            return {
              structuredContent: {
                nationalities: [
                  { nation_code: "id", nationality: "Indonesia", phone_code: "+62" },
                  { nation_code: "us", nationality: "United States", phone_code: "+1" },
                  { nation_code: "sg", nationality: "Singapore", phone_code: "+65" },
                  { nation_code: "ae", nationality: "United Arab Emirates", phone_code: "+971" },
                ],
              },
            };
          }
          if (name === "create_order") {
            return { structuredContent: { url: "https://m.grandalaric.com/pay/EXAMPLE-TOKEN", booking: { hotel_id: args.hotel_id, guest_name: args.guest_name } } };
          }
          return null;
        },
        openExternal: (o) => alert("openExternal →\n\n" + o.href),
      };
    </script>
    <script type="module" src="/src/hotel-list.jsx"></script>
  </body>
</html>
