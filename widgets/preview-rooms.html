<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin: 0; padding: 24px; background: #ececec; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Grouped rooms like /rooms now returns (rooms with nested rates). The Junior
      // Suite rate carries conditions + benefits to exercise the expand panel.
      window.openai = {
        theme: "light",
        toolOutput: {
          query: { hotel_id: "GSV", check_in: "2026-07-10", check_out: "2026-07-12", guests: 2 },
          rooms: [
            {
              name: "Superior City View",
              image: "https://picsum.photos/seed/sup/520/360",
              images: ["https://picsum.photos/seed/sup/520/360"],
              meta: "1 queen bed · 2 guests · 28 m²",
              description: "A bright room with floor-to-ceiling city views.",
              rates: [
                { room_id: "SUPK-ROO", room_name_sub: "Standard rate", meal: "Without breakfast", price: 650000 },
                { room_id: "SUPK-IWS312ROO", room_name_sub: "Book Direct & Save More", meal: "Without breakfast", price: 520000, original_price: 650000, conditions: ["Non-refundable"], benefits: ["Welcome drink", "Free sauna access"] },
              ],
            },
            {
              name: "Junior Suite",
              image: "https://picsum.photos/seed/jr/520/360",
              images: ["https://picsum.photos/seed/jr/520/360"],
              meta: "1 king · 3 guests · 40 m²",
              description: "Extra living space with a quiet sitting area.",
              rates: [
                { room_id: "JRST-EB4339BAR", room_name_sub: "Early Bird 14 Days", meal: "Bed & breakfast", price: 890000, original_price: 1100000, conditions: ["Free cancellation until 48h before", "Breakfast for 2 included"], benefits: ["Welcome drink on arrival", "Late checkout (on availability)", "10% off spa"] },
              ],
            },
          ],
        },
        sendFollowUpMessage: (m) => alert("→ would send to ChatGPT:\n\n" + m.prompt),
      };
    </script>
    <script type="module" src="/src/room-results.jsx"></script>
  </body>
</html>
